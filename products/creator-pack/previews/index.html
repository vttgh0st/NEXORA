<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA — Creator Pack Previews</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#070707;
    color:#fff;
    font-family:Arial,sans-serif;
    padding:40px;
}
h1{
    text-align:center;
    margin:0 0 10px;
    font-size:38px;
}
p{
    text-align:center;
    color:#777;
    margin-bottom:40px;
}
.grid{
    max-width:1200px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:24px;
}
.card{
    background:#111;
    border:1px solid #252525;
    border-radius:18px;
    overflow:hidden;
}
.card img{
    display:block;
    width:100%;
    height:auto;
}
.label{
    padding:16px;
    color:#aaa;
    font-size:14px;
}
a{
    display:block;
    width:max-content;
    margin:35px auto 0;
    color:#fff;
    text-decoration:none;
    border:1px solid #333;
    padding:12px 20px;
    border-radius:10px;
}
a:hover{background:#151515}
</style>
</head>
<body>

<h1>NEXORA / CREATOR PACK</h1>
<p>Preview oficial dos templates</p>

<div class="grid">

<div class="card">
<img src="preview-01.svg" alt="Preview 01">
<div class="label">01 — Neon Social</div>
</div>

<div class="card">
<img src="preview-02.svg" alt="Preview 02">
<div class="label">02 — Dark Minimal</div>
</div>

<div class="card">
<img src="preview-03.svg" alt="Preview 03">
<div class="label">03 — Bold Message</div>
</div>

<div class="card">
<img src="preview-04.svg" alt="Preview 04">
<div class="label">04 — Creator Mode</div>
</div>

<div class="card">
<img src="preview-05.svg" alt="Preview 05">
<div class="label">05 — Premium Brand</div>
</div>

</div>

<a href="../">← Voltar para o Creator Pack</a>

</body>
</html>
